<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>리드AI · 접속</title><link rel="stylesheet" href="/styles.css"><script src="/login.js" defer></script></head>
<body><main><div class="main-content">
<h1>리드AI 콘텐츠 검토</h1><p>공유 작업공간의 접속 비밀번호를 입력하세요.</p>
<form id="login-form"><label class="field-label" for="password">접속 비밀번호</label>
<input id="password" type="password" autocomplete="current-password" required maxlength="256">
<button class="primary" type="submit">접속하기</button></form>
<p id="login-error" role="alert"></p></div></main></body></html>
